<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новости</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header class="site-header"><a class="brand" href="/">Образовательная деятельность<br><span>Московской митрополии</span></a><nav><a href="/">Главная</a><a href="/novosti">Новости</a><a href="/admin">Кабинет</a></nav></header><main class="section"><p class="eyebrow">Архив публикаций</p><h1>Новости</h1><form class="search-row"><input name="q" th:value="${query}" placeholder="Поиск по новостям"><button>Найти</button></form><div class="news-grid" th:if="${!news.isEmpty()}"><article class="news-card" th:each="item : ${news}"><img th:if="${item.coverImageUrl}" th:src="${item.coverImageUrl}" alt=""><div><p class="date" th:text="${#temporals.format(item.publishedAt, 'dd.MM.yyyy')}"></p><h3><a th:href="@{/novosti/{slug}(slug=${item.slug})}" th:text="${item.title}"></a></h3><p th:text="${item.summary}"></p></div></article></div><div class="empty" th:if="${news.isEmpty()}">Новости не найдены.</div></main></body></html>
